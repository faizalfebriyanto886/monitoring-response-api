<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flutter API Monitor</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>API Monitor</h1>
          <p>Production Flutter API observability</p>
        </div>
        <button id="clear">Clear logs</button>
      </header>

      <section class="cards">
        <div>
          <span>Total requests</span>
          <strong id="total">0</strong>
        </div>
        <div>
          <span>Errors (latest 100)</span>
          <strong id="errors">0</strong>
        </div>
        <div>
          <span>Average response (latest 100)</span>
          <strong id="avg">0 ms</strong>
        </div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <input id="search" placeholder="Search endpoint or URL">
          <select id="status">
            <option value="">All status</option>
            <option>200</option>
            <option>201</option>
            <option>400</option>
            <option>401</option>
            <option>403</option>
            <option>404</option>
            <option>500</option>
          </select>
          <select id="platform">
            <option value="">All platforms</option>
            <option value="ios">iOS</option>
            <option value="android">Android</option>
          </select>
          <button id="refresh">Refresh</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Time</th>
                <th>App</th>
                <th>Device</th>
                <th>Method</th>
                <th>Endpoint</th>
                <th>Status</th>
                <th>Duration</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="detail">
      <div class="detail-head">
        <h2>API Detail</h2>
        <button id="detail-close" type="button" aria-label="Close detail">×</button>
      </div>
      <pre id="json"></pre>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
